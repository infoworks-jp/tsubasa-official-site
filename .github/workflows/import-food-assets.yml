name: Import official food assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-food-assets.yml'

permissions:
  contents: write

jobs:
  import-food-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download the 10 approved food photos into this repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/food
          BASE='https://raw.githubusercontent.com/infoworks-jp/tubasa-cell.github.io/main/newsite/v2/assets'
          curl -fsSL "$BASE/butter.webp"  -o assets/food/butter.webp
          curl -fsSL "$BASE/chashu.webp"  -o assets/food/chashu.webp
          curl -fsSL "$BASE/fried.webp"   -o assets/food/fried.webp
          curl -fsSL "$BASE/gyoza.webp"   -o assets/food/gyoza.webp
          curl -fsSL "$BASE/hero.webp"    -o assets/food/hero.webp
          curl -fsSL "$BASE/kimchi.webp"  -o assets/food/kimchi.webp
          curl -fsSL "$BASE/limited.webp" -o assets/food/limited.webp
          curl -fsSL "$BASE/negi.webp"    -o assets/food/negi.webp
          curl -fsSL "$BASE/shio.webp"    -o assets/food/shio.webp
          curl -fsSL "$BASE/spicy.webp"   -o assets/food/spicy.webp
          test "$(find assets/food -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 10
          for f in assets/food/*.webp; do test -s "$f"; done
      - name: Commit food photos locally to official repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/food
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add 10 official food photos to assets/food'
            git push origin HEAD:main
          fi
