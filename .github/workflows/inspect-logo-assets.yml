name: Inspect logo assets

on:
  push:
    paths:
      - '.github/workflows/inspect-logo-assets.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Inspect logo files
        shell: bash
        run: |
          set -u
          file assets/logo.png assets/logo-horizontal.jpg assets/logo-vertical.svg
          wc -c assets/logo.png assets/logo-horizontal.jpg assets/logo-vertical.svg
          python - <<'PY'
          from pathlib import Path
          import base64,re
          s=Path('assets/logo-vertical.svg').read_text()
          m=re.search(r'base64,([^\"\']+)',s)
          if not m:
              print('SVG_EMBEDDED_PNG=missing')
          else:
              try:
                  raw=base64.b64decode(m.group(1),validate=True)
                  print('SVG_BASE64_VALID=true','EMBEDDED_BYTES',len(raw))
              except Exception as e:
                  print('SVG_BASE64_VALID=false',type(e).__name__,str(e))
          PY
      - name: Upload logo candidates
        uses: actions/upload-artifact@v4
        with:
          name: logo-asset-diagnostics
          path: |
            assets/logo.png
            assets/logo-horizontal.jpg
            assets/logo-vertical.svg
          if-no-files-found: error
          retention-days: 2
