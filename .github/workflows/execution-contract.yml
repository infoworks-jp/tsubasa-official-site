name: Execution contract

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: execution-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Validate execution state
        run: node ops/validate-execution.mjs
      - name: Require state update for visual/site changes
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then exit 0; fi
          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
          printf '%s\n' "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Eq '^(index\.html|fluid\.js|polish\.css|assets/|verify-public\.mjs|\.github/workflows/verify-public\.yml)'; then
            printf '%s\n' "$CHANGED" | grep -qx 'ops/execution-state.json' || { echo 'FAIL: site/visual change without execution-state update'; exit 1; }
          fi
      - name: Gate STARTED claim
        run: node ops/claim-gate.mjs started
      - name: Gate COMPLETE claim
        shell: bash
        run: |
          STATUS=$(node -p "require('./ops/execution-state.json').status")
          if [ "$STATUS" = "VISUAL_VERIFIED" ]; then
            node ops/claim-gate.mjs complete
            node ops/acceptance-gate.mjs
          else
            echo "Completion forbidden while status=$STATUS"
          fi
