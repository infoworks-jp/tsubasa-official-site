name: Verify result gate

on:
  workflow_run:
    workflows: ["Verify public site"]
    types: [completed]

concurrency:
  group: verify-result-gate-main
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate completed verification run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "verification_run=$RUN_ID"
          echo "head_sha=$HEAD_SHA"
          echo "conclusion=$RUN_CONCLUSION"
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "FAIL: visual verification did not succeed"
            exit 1
          fi
          ARTIFACTS=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts")
          node -e 'const x=JSON.parse(process.argv[1]); const a=x.artifacts||[]; if(!a.some(v=>v.name==="public-site-verification"&&!v.expired)){console.error("FAIL: verification artifact missing");process.exit(1)}' "$ARTIFACTS"
          echo "PASS: verification completed and evidence artifact exists"
