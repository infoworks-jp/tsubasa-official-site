name: Import official store photo
on:
  push:
    paths:
      - '.github/workflows/import-store-photo.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official store interior photo
        run: |
          mkdir -p assets
          curl -L --fail 'https://static.wixstatic.com/media/4d13fe_5878bee977d84432bbdcbdf093f59044~mv2.jpg' -o assets/store-interior.jpg
      - name: Commit photo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/store-interior.jpg
          git commit -m 'Add official store interior photo' || exit 0
          git push
