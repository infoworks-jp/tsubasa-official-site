name: Import exact official hero and interior photos

on:
  push:
    paths:
      - '.github/workflows/import-official-hero-interior.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Download exact approved images
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://at.adobe.com/0FgjqVXC5Ca8j230' -o /tmp/top.png
          curl -fL --retry 3 'https://at.adobe.com/xs5POGvPXe8RB0QD' -o /tmp/interior.png
          echo '22039093010044c8da71a6b52e25932b0a1be3c9fd00f318224befb02204ad8a  /tmp/top.png' | sha256sum -c -
          echo '7dc17baca082b8fd259b99503fa7241cc4f265f36f60e8eddbf17d1576c71ce9  /tmp/interior.png' | sha256sum -c -
          test $(stat -c%s /tmp/top.png) -eq 3230819
          test $(stat -c%s /tmp/interior.png) -eq 3612864
          cp /tmp/top.png assets/susukino-top-20260816.png
          cp /tmp/interior.png assets/store-interior.png
      - name: Point site to exact interior PNG and update execution state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("assets/store-interior.jpg", "assets/store-interior.png")
          p.write_text(s)
          import json
          q=Path('ops/execution-state.json')
          d=json.loads(q.read_text())
          d['task_id']='official-image-replacement-20260816'
          d['request']='Replace hero and store interior with the exact approved user-supplied originals, then verify public desktop and mobile output.'
          d['status']='COMMITTED'
          d['visual_evidence']['passed']=False
          d['visual_evidence']['qa_run_id']=None
          q.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit exact images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/susukino-top-20260816.png assets/store-interior.png index.html ops/execution-state.json
          git commit -m 'Replace hero and interior with exact approved originals'
          git push
