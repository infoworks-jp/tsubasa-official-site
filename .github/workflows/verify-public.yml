name: Verify public site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install Playwright and image diff tools
        run: |
          npm init -y
          npm install playwright sharp
          npx playwright install --with-deps chromium
      - name: Verify deployed animation with timed evidence
        run: node verify-public.mjs
      - name: Upload evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: public-site-verification
          path: verification-artifacts/
          retention-days: 30
