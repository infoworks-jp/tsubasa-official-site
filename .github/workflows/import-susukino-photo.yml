name: Import official Susukino photo
on:
  push:
    paths:
      - '.github/workflows/import-susukino-photo.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode exact official Susukino photo
        run: |
          base64 -d assets/susukino-intersection.b64 > assets/susukino-intersection.jpg
      - name: Commit photo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/susukino-intersection.jpg
          git commit -m 'Add official Susukino intersection photo' || exit 0
          git push
