<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>味一番つばさ｜Fluid Reveal Demo</title><style>*{box-sizing:border-box}html,body{margin:0;background:#030303;color:#fff;font-family:'Hiragino Mincho ProN','Yu Mincho',serif}body{overflow-x:hidden}.hero{height:170vh;position:relative}.sticky{position:sticky;top:0;height:100svh;overflow:hidden;background:#000}.photo,.reveal{position:absolute;inset:0;background-size:cover;background-position:center 54%;transform:scale(1.035)}.photo{background-image:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.05) 60%,rgba(0,0,0,.28)),url('assets/ramen-user.jpg')}.reveal{background-image:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,.05)),url('assets/susukino-top-20260816.png');clip-path:circle(var(--reveal,0px) at var(--mx,50%) var(--my,50%));filter:saturate(1.15) contrast(1.08)}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.ink{z-index:3;mix-blend-mode:multiply}.steam{z-index:4;mix-blend-mode:screen}.shade{position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(0deg,#000 0,transparent 25%,transparent 75%,rgba(0,0,0,.3))}.brand{position:absolute;z-index:8;left:6vw;top:50%;transform:translateY(-50%);max-width:82vw}.eyebrow{font:600 10px/1.4 -apple-system,sans-serif;letter-spacing:.38em;color:#d5b16b;margin-bottom:20px}.title{margin:0;font-size:clamp(58px,10vw,150px);font-weight:400;letter-spacing:.08em;line-height:.95;display:inline-block;position:relative;filter:url(#liquid)}.title span{display:block}.lead{font-size:clamp(13px,1.3vw,18px);line-height:2;letter-spacing:.16em;margin-top:28px;text-shadow:0 3px 18px #000}.hint{position:absolute;z-index:9;right:3vw;bottom:4vh;font:10px/1.7 -apple-system,sans-serif;letter-spacing:.2em;color:#ddd;writing-mode:vertical-rl}.progress{position:absolute;z-index:10;left:0;bottom:0;height:2px;width:var(--progress,0%);background:#c91b22;box-shadow:0 0 16px #ff2930}.after{min-height:100vh;background:#070504;padding:12vh 7vw;display:grid;place-items:center}.after h2{font-size:clamp(42px,7vw,100px);font-weight:400;letter-spacing:.1em;margin:0;text-align:center}.after p{font:13px/2 -apple-system,sans-serif;color:#aaa;text-align:center;letter-spacing:.12em}.badge{position:absolute;z-index:12;left:18px;top:18px;font:9px/1 -apple-system,sans-serif;letter-spacing:.18em;border:1px solid #ffffff55;padding:8px 10px;background:#0008}@media(max-width:700px){.hero{height:150vh}.brand{left:7vw;top:56%}.title{font-size:clamp(48px,16vw,82px)}.lead{font-size:12px}.photo{background-position:center}.hint{right:12px}.eyebrow{letter-spacing:.24em}}@media(prefers-reduced-motion:reduce){.title{filter:none}}</style></head><body><section class="hero" id="hero"><div class="sticky" id="stage"><div class="photo"></div><div class="reveal" id="reveal"></div><canvas class="ink" id="ink"></canvas><canvas class="steam" id="steam"></canvas><div class="shade"></div><div class="badge">INTERACTIVE PROTOTYPE</div><div class="brand"><div class="eyebrow">AJIICHIBAN TSUBASA · SUSUKINO</div><h1 class="title" id="title"><span>味一番</span><span>つばさ</span></h1><p class="lead">湯気に触れ、文字に触れ、<br>すすきのの夜を一杯の向こうへ。</p></div><div class="hint">MOVE · TOUCH · SCROLL</div><div class="progress" id="progress"></div><svg width="0" height="0" aria-hidden="true"><filter id="liquid"><feTurbulence id="noise" type="fractalNoise" baseFrequency=".008 .02" numOctaves="2" seed="3" result="n"/><feDisplacementMap id="disp" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="B"/></filter></svg></div></section><section class="after"><div><h2>湯気まで、旨い。</h2><p>味一番つばさ · 新ラーメン横丁</p></div></section><script>(()=>{const stage=document.querySelector('#stage'),hero=document.querySelector('#hero'),reveal=document.querySelector('#reveal'),ink=document.querySelector('#ink'),steam=document.querySelector('#steam'),ig=ink.getContext('2d'),sg=steam.getContext('2d'),title=document.querySelector('#title'),disp=document.querySelector('#disp'),noise=document.querySelector('#noise'),progress=document.querySelector('#progress');let W=0,H=0,dpr=1,mx=.52,my=.48,tx=mx,ty=my,lastX=innerWidth*.52,lastY=innerHeight*.48,speed=0,hover=false,t=0;const puffs=[],drops=[];function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,1.5);W=r.width;H=r.height;for(const c of[ink,steam]){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);c.style.width=W+'px';c.style.height=H+'px'}ig.setTransform(dpr,0,0,dpr,0,0);sg.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function move(x,y){const r=stage.getBoundingClientRect();tx=Math.max(0,Math.min(1,(x-r.left)/r.width));ty=Math.max(0,Math.min(1,(y-r.top)/r.height));const dx=x-lastX,dy=y-lastY;speed=Math.min(45,Math.hypot(dx,dy));lastX=x;lastY=y;const tr=title.getBoundingClientRect();hover=x>tr.left&&x<tr.right&&y>tr.top&&y<tr.bottom;if(speed>2){puffs.push({x:x-r.left,y:y-r.top,vx:dx*.018,vy:-.35-Math.random()*.35,r:10+Math.random()*18,a:.13+Math.random()*.12,life:1});if(Math.random()>.48)drops.push({x:x-r.left,y:y-r.top,vx:dx*.08,vy:dy*.08,r:12+speed*.35,life:1})}}addEventListener('pointermove',e=>move(e.clientX,e.clientY),{passive:true});addEventListener('touchmove',e=>{const q=e.touches[0];if(q)move(q.clientX,q.clientY)},{passive:true});function mist(x,y,r,a){const q=sg.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,`rgba(255,252,246,${a})`);q.addColorStop(.35,`rgba(245,244,240,${a*.45})`);q.addColorStop(1,'rgba(235,235,235,0)');sg.fillStyle=q;sg.beginPath();sg.arc(x,y,r,0,Math.PI*2);sg.fill()}function inkDrop(d){const q=ig.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r*2.5);q.addColorStop(0,`rgba(3,3,3,${.72*d.life})`);q.addColorStop(.45,`rgba(8,4,4,${.34*d.life})`);q.addColorStop(1,'rgba(0,0,0,0)');ig.fillStyle=q;ig.beginPath();ig.arc(d.x,d.y,d.r*2.5,0,Math.PI*2);ig.fill()}function frame(){t+=.016;mx+=(tx-mx)*.08;my+=(ty-my)*.08;speed*=.9;sg.clearRect(0,0,W,H);ig.fillStyle='rgba(0,0,0,.055)';ig.fillRect(0,0,W,H);const bowlX=W*.54,bowlY=H*.53;for(let i=0;i<8;i++){const phase=(t*.055+i/8)%1,life=Math.sin(Math.PI*phase),x=bowlX+Math.sin(t*.45+i*2.7+phase*5)*18*(.3+phase)+((mx-.5)*35)*phase,y=bowlY-phase*220;mist(x,y,18+phase*34,.045*life)}for(let i=puffs.length-1;i>=0;i--){const p=puffs[i];p.x+=p.vx+(mx-.5)*.18;p.y+=p.vy;p.r+=.35;p.life-=.012;mist(p.x,p.y,p.r,p.a*Math.max(0,p.life));if(p.life<=0)puffs.splice(i,1)}for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.x+=d.vx;d.y+=d.vy;d.vx*=.96;d.vy*=.96;d.r+=.5;d.life-=.018;inkDrop(d);if(d.life<=0)drops.splice(i,1)}const scroll=Math.max(0,Math.min(1,-hero.getBoundingClientRect().top/(hero.offsetHeight-innerHeight)));const radius=(scroll*.78+Math.min(speed/90,.16))*Math.hypot(W,H);stage.style.setProperty('--mx',(mx*100)+'%');stage.style.setProperty('--my',(my*100)+'%');stage.style.setProperty('--reveal',radius+'px');stage.style.setProperty('--progress',(scroll*100)+'%');const distortion=(hover?30:4)+speed*.5+scroll*14;disp.setAttribute('scale',distortion.toFixed(1));noise.setAttribute('baseFrequency',`${(.008+Math.sin(t*.7)*.002).toFixed(4)} ${(.018+speed*.0002).toFixed(4)}`);requestAnimationFrame(frame)}requestAnimationFrame(frame)})();</script></body></html>
