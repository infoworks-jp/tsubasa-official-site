<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>味一番つばさ｜究極の味噌</title>
  <meta name="description" content="すすきの・新ラーメン横丁 味一番つばさ。究極の味噌ラーメン。" />
  <style>
    :root{--bg:#050505;--red:#9c120f;--muted:#cfc7bc}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
    body{overflow-x:hidden}
    .hero{position:relative;min-height:100svh;isolation:isolate;background:#050505;overflow:hidden}
    .hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 60% 55%,rgba(255,255,255,.06),transparent 28%),linear-gradient(180deg,#050505 0%,#070707 58%,#120806 100%);z-index:-4}
    .hero::after{content:"";position:absolute;left:-8%;right:-8%;bottom:-8%;height:34%;background:radial-gradient(ellipse at 50% 0%,rgba(160,18,15,.72),rgba(93,11,9,.45) 35%,rgba(0,0,0,0) 72%);filter:blur(10px);z-index:-2}
    .photo{position:absolute;left:50%;bottom:-2.5vw;width:min(1050px,104vw);transform:translateX(-50%);z-index:-1;filter:saturate(.92) contrast(1.04) brightness(.84);user-select:none;pointer-events:none}
    .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.06) 42%,rgba(0,0,0,.12) 67%,rgba(0,0,0,.72) 100%);z-index:0;pointer-events:none}
    .smoke{position:absolute;inset:-10% 0 24% 0;z-index:-1;opacity:.68;filter:blur(10px);background:radial-gradient(ellipse at 48% 48%,rgba(255,255,255,.18),rgba(255,255,255,0) 16%),radial-gradient(ellipse at 55% 34%,rgba(255,255,255,.10),rgba(255,255,255,0) 13%),radial-gradient(ellipse at 46% 23%,rgba(255,255,255,.08),rgba(255,255,255,0) 10%);animation:drift 8s ease-in-out infinite alternate;pointer-events:none}
    @keyframes drift{from{transform:translate3d(-1%,1%,0) scale(1)}to{transform:translate3d(2%,-2%,0) scale(1.05)}}
    .topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(28px,env(safe-area-inset-top)) 30px 0;z-index:3}
    .brand{writing-mode:vertical-rl;font-family:serif;font-weight:700;font-size:22px;letter-spacing:.18em;text-shadow:0 2px 16px rgba(0,0,0,.9)}
    .seal{display:inline-block;margin-top:6px;color:#9e1713;font-size:11px;letter-spacing:0}
    .menu{width:30px;height:22px;display:grid;align-content:space-between;opacity:.9}
    .menu span{height:1px;background:#fff;display:block}
    .copy{position:absolute;left:7vw;bottom:8.5vh;z-index:3;max-width:520px;text-shadow:0 2px 24px rgba(0,0,0,.85)}
    .kicker{display:flex;align-items:center;gap:14px;font-family:Georgia,serif;letter-spacing:.12em;font-size:16px;color:#f5eee7}
    .kicker::before{content:"";width:2px;height:58px;background:#b01814;display:block}
    h1{margin:.65rem 0 0;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(42px,6vw,74px);font-weight:500;letter-spacing:.16em}
    .sub{margin-top:14px;font-size:13px;letter-spacing:.18em;color:var(--muted)}
    .scroll{position:absolute;right:28px;bottom:28px;z-index:3;font-size:10px;letter-spacing:.2em;color:#c9c1b7;writing-mode:vertical-rl}
    @media(max-width:720px){.topbar{padding-left:20px;padding-right:20px}.brand{font-size:18px}.photo{width:155vw;max-width:none;left:52%;bottom:4vh}.copy{left:7vw;bottom:6.5vh;max-width:86vw}.kicker{font-size:12px;gap:10px}.kicker::before{height:45px}h1{font-size:clamp(36px,11vw,52px);letter-spacing:.12em}.sub{font-size:11px;max-width:78vw;line-height:1.8}.scroll{display:none}.shade{background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.04) 37%,rgba(0,0,0,.04) 65%,rgba(0,0,0,.82) 100%)}}
    @media(prefers-reduced-motion:reduce){.smoke{animation:none}}
  </style>
</head>
<body>
  <main class="hero" aria-label="味一番つばさ ファーストビュー">
    <img class="photo" src="https://static.wixstatic.com/media/4d13fe_696168f8e6394f7595a9168e02a58cb4~mv2.png/v1/fill/w_1200,h_1000,al_c,q_90/4d13fe_696168f8e6394f7595a9168e02a58cb4~mv2.png" alt="味一番つばさ 究極の味噌ラーメン" />
    <div class="smoke" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>
    <header class="topbar"><div class="brand">つばさ<span class="seal">味一番</span></div><div class="menu" aria-hidden="true"><span></span><span></span><span></span></div></header>
    <section class="copy"><div class="kicker">01 — SIGNATURE</div><h1>究極の味噌</h1><div class="sub">SAPPORO · SUSUKINO · SHIN RAMEN YOKOCHO</div></section>
    <div class="scroll">SCROLL</div>
  </main>
  <script>
    (()=>{const hero=document.querySelector('.hero');const smoke=document.querySelector('.smoke');if(!hero||!smoke||matchMedia('(prefers-reduced-motion: reduce)').matches)return;let tx=0,ty=0,cx=0,cy=0;const move=e=>{const p=e.touches?e.touches[0]:e;tx=(p.clientX/innerWidth-.5)*16;ty=(p.clientY/innerHeight-.5)*10};addEventListener('pointermove',move,{passive:true});addEventListener('touchmove',move,{passive:true});const tick=()=>{cx+=(tx-cx)*.05;cy+=(ty-cy)*.05;smoke.style.translate=`${cx}px ${cy}px`;requestAnimationFrame(tick)};tick()})();
  </script>
</body>
</html>
